<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB | Baseball</title>
    <link rel="stylesheet" href="styles.css">

    <!--FONT AWESOME ICONS-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
        integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!--FavIcon-->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
    <div class="flex flex-col max-w-7xl mx-auto">
        <!--HEADER-->
        <header class="bg-[#041E42] w-full">
            <div class="mx-auto flex flex-row justify-between items-center p-4 px-4 md:px-8">
                <img src="images/MLB.svg" alt="MLB Logo" class="w-16 h-auto flex justify-start">
                <div class="flex gap-4">
                    <a href="#" class="hover:scale-110 transition-transform duration-200">
                        <img src="images/user-icon.svg" alt="User Icon" class="w-8 h-8">
                    </a>
                    <a href="#" class="hover:scale-110 transition-transform duration-200">
                        <img src="images/bag-icon.svg" alt="Bag Icon" class="w-8 h-8">
                    </a>
                </div>
            </div>
        </header>

        <!--nav start-->
        <nav class="bg-[#f5f5f5]">
            <ul class="flex flex-col sm:flex-row justify-center items-center gap-2 sm:gap-8 px-4 py-4 max-w-7xl mx-auto shadow-lg">
                <li>
                    <a href="#"
                        class="block px-4 py-2 font-semibold text-lg text-[#2d4d6f] hover:text-[#041E42] hover:bg-[#041E42]/10 rounded-lg transition-all duration-200">MLB.TV</a>
                </li>
                <li>
                    <a href="#"
                        class="block px-4 py-2 font-semibold text-lg text-[#041E42] bg-[#041E42]/10 rounded-lg transition-all duration-200">TICKETS</a>
                </li>
                <li>
                    <a href="#"
                        class="block px-4 py-2 font-semibold text-lg text-[#2d4d6f] hover:text-[#041E42] hover:bg-[#041E42]/10  rounded-lg transition-all duration-200">SHOP</a>
                </li>
                <li>
                    <a href="#"
                        class="block px-4 py-2 font-semibold text-lg text-[#2d4d6f] hover:text-[#041E42] hover:bg-[#041E42]/10 rounded-lg transition-all duration-200">TEAMS</a>
                </li>
            </ul>
        </nav>

        <!--MAIN-->
        <main>
            <h1 class="text-lg sm:text-3xl font-bold text-[#041E42] leading-tight px-8 pt-8">Welcome to MLB Baseball</h1>
            <section id="mlbTeamExperiences" class="grid grid-cols-1 sm:grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mt-2 mb-2 px-4">
                <!-- Cards will be dynamically inserted here -->
            </section>
        </main>






        <!--footer start-->
        <footer class="bg-[#f5f5f5] py-4">
            <div class="max-w-7xl mx-auto text-center">
                <p class="text-sm text-[#041E42]">© 2023 SETH ELLIOTT &bull; UVU DWDD-2620 &bull; Not affiliated with Major League Baseball &bull;
                    For school learning/use only.</p>
            </div>
        </footer>
    </div>


  <script src="js/script.js" type="module"></script>  
</body>
</html>
